name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  native-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-rsvg-2.0 xvfb fonts-inter fonts-noto-cjk
      - run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/pip install -e .
      - run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
